# gitleaks' default rules, plus one exemption.
#
# `generic-api-key` matches on the word "key" followed by a value with entropy
# above its threshold, and `sonar.projectKey=EricMG13_CAOS-Final` is both: it
# scores 4.14. That finding failed the `security` gate the first time a scanner
# configuration was committed here, and docs/DECISIONS.md section 31 records it
# as one of the reasons the file was removed. Section 39 brings the file back,
# because a coverage report can only reach a CI analysis, so the finding has to
# be answered rather than avoided.
#
# It is answered by what the value is. A SonarQube project key is a public
# identifier -- it is in the query string of every dashboard URL the analysis
# check posts, and it identifies a project rather than authorising anything. The
# credential is SONAR_TOKEN, which is a repository secret, is not in this tree,
# and is not exempted here or anywhere.
[extend]
useDefault = true

# Scoped to the exact string, not to the file. A path exemption would tell the
# scanner to stop reading sonar-project.properties, and a real credential pasted
# into it later would then be the one thing nothing here reads.
# test_the_secret_exemption_names_a_string_rather_than_a_file holds that.
#
# `[allowlist]`, singular, and not `[[allowlists]]`: on gitleaks 8.24.3 -- the
# version `make security` and the CI action both run -- the plural form parses
# without complaint and exempts nothing. Measured, on this file: singular, no
# leaks found; plural, the finding stands. That failure is loud rather than
# silent, since the gate stays red, but it costs an afternoon to read.
[allowlist]
description = "The Sonar project key is an identifier, not a credential"
regexTarget = "match"
regexes = ['''sonar\.projectKey=EricMG13_CAOS-Final''']
