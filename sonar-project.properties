# The scanner CLI's configuration, read by the `sonarqube` CI job.
#
# This file was refused until now, and docs/DECISIONS.md section 31 is why: under
# automatic analysis it configured nothing, because the analysis ran from
# SonarQube Cloud's side and ignored it. Section 41 reverses that. Automatic
# analysis cannot import a coverage report, so an analysis that reads coverage is
# a CI analysis, and a CI analysis reads this file.
#
# The identifiers below are not credentials. A project key is in every dashboard
# URL the check posts; the credential is SONAR_TOKEN, which is a repository
# secret and appears nowhere in this tree.
# The organisation key is the project key's own prefix: SonarQube Cloud names an
# imported project `<organisation>_<repository>`. Written lower-case first, on
# the assumption that the key was folded from the GitHub login, and the scanner
# answered "Not authorized or project not found ... a project with the same key
# may already exist in another organization" -- which is what a wrong
# organisation looks like from outside.
sonar.projectKey=EricMG13_CAOS-Final
sonar.organization=EricMG13

# What bandit is pointed at (SEC_TARGETS in the Makefile) and what it
# deliberately is not (SEC_UNSCANNED) -- which this analysis reads as tests
# rather than skipping. Between the two, every tracked .py is claimed: the floor
# docs/AI_CODE_QUALITY.md section 4 holds bandit to, applied here.
# test_the_analysis_claims_every_tracked_python_file keeps them level.
sonar.sources=scripts,server,methodology
sonar.tests=tests
#
# Unset, SonarPython evaluates every rule against all of Python 3 at once and
# says so in the project's analysis warnings. The repository is 3.14 only
# (docs/DECISIONS.md section 10), and the type gate reads the same number.
sonar.python.version=3.14
#
# The methodology bundle is authority we never edit (docs/DECISIONS.md section
# 6), so a finding in its 147 Python files names something no pull request is
# allowed to fix. sonar.sources already leaves it out; this is the second lock,
# and the one that still holds if the source list ever widens.
sonar.exclusions=vendor/**
#
# Written by the suite itself (pyproject.toml [tool.coverage]) and handed to this
# job as an artifact, because the analysis runs where the tests do not.
# scripts/scan_floors.py --cobertura refuses the report before it gets here if it
# measured nothing or left a tracked file out: an unreadable path imports as no
# coverage rather than as an error, which is the one failure this file cannot
# state and the floor can.
sonar.python.coverage.reportPaths=coverage.xml
