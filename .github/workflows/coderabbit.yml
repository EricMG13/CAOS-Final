# CodeRabbit does not auto-review this repository. Its own words, on PR #20:
# "This repository does not receive automatic reviews because it has fewer than
# 10 stars." docs/AI_CODE_QUALITY.md section 2 counts it as the third reviewer
# beside confidence-review and adversarial-reviewer, so the request it will not
# make on its own is made here, on every PR.
#
# No third-party action is used, so there is no action SHA to pin: `gh` ships on
# the runner.
name: coderabbit

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr comment "$NUMBER" --body "@coderabbitai review"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.number }}
