# Jobs arrive with the phase whose code they can actually scan. A job that
# passes because it found nothing is the failure mode docs/AI_CODE_QUALITY.md
# section 4 exists to prevent, so none is scaffolded ahead of its subject:
#   model    (LibreOffice recalc) .... Phase 7
#   frontend (lint, tsc, a11y) ....... Phase 9
#   image    (Trivy) ................. the phase that adds the Dockerfile
name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_vocabulary.py
      - run: python scripts/check_tested.py

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: mypy scripts tests server

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Digest-pinned; a tag alone is not a pin. postgres:16-alpine.
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env: {POSTGRES_PASSWORD: caos, POSTGRES_DB: caos}
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pytest
        env:
          CAOS_TEST_POSTGRES_URL: postgresql://postgres:caos@localhost:5432/caos
          # A store suite that skipped is not a store suite that passed.
          CAOS_REQUIRE_POSTGRES: "1"
      - run: python scripts/io_budget.py --assert

  postgres:
    # Every governed race proven on two independent connections, in its own job
    # so the coverage is visible rather than buried in the unit run.
    runs-on: ubuntu-latest
    services:
      postgres:
        # Digest-pinned; a tag alone is not a pin. postgres:16-alpine.
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env: {POSTGRES_PASSWORD: caos, POSTGRES_DB: caos}
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pytest tests/test_postgres_races.py
        env:
          CAOS_TEST_POSTGRES_URL: postgresql://postgres:caos@localhost:5432/caos
          # A store suite that skipped is not a store suite that passed.
          CAOS_REQUIRE_POSTGRES: "1"

  security:
    # Python pinned deliberately. bandit 1.7.10 reaches for ast.Constant.s,
    # which newer interpreters do not provide: under 3.14 it skips every file
    # and exits 0. See docs/AI_CODE_QUALITY.md section 4.
    runs-on: ubuntu-latest
    # gitleaks-action lists a pull request's commits; the default token cannot.
    permissions: {contents: read, pull-requests: read}
    steps:
      # gitleaks scans a commit range; a depth-1 clone has no range to scan.
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --require-hashes -r requirements-security.txt
      # `|| true` so the floor check, not bandit's exit code, is the verdict:
      # a report that parsed nothing must fail even when it found nothing.
      - run: bandit -r scripts server -f json -o bandit.json || true
      - run: python scripts/scan_floors.py bandit.json --min-files 1 --no-parse-errors
      - run: bandit -r scripts server
      - run: |
          pip-audit --require-hashes -r requirements.txt \
                    -r requirements-dev.txt -r requirements-security.txt
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The scan result is the gate; the uploaded artifact is not. Uploading
          # needs `actions: write`, which this job has no other use for.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  size:
    # AI PRs carry ~1.7x the issues of human PRs, and density rises with size.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          n=$(git diff --numstat origin/${{ github.base_ref }}...HEAD -- . \
              ':!*.lock' ':!requirements*.txt' ':!**/vendor/**' ':!docs/**' \
              | awk '{s+=$1+$2} END {print s+0}')
          echo "changed lines: $n"
          [ "$n" -le 800 ] || { echo "PR too large; split it (docs/AI_CODE_QUALITY.md)"; exit 1; }
