# Jobs arrive with the phase whose code they can actually scan. A job that
# passes because it found nothing is the failure mode docs/AI_CODE_QUALITY.md
# section 4 exists to prevent, so none is scaffolded ahead of its subject:
#   frontend (lint, tsc, a11y) ....... Phase 9
#   image    (Trivy) ................. the phase that adds the Dockerfile
name: ci
on:
  push:
  pull_request:
    # Declared, not defaulted. The default set is opened, synchronize and
    # reopened, and a draft pull request produced no `pull_request` run at all
    # here -- so under DECISIONS.md 41, where the analysis is a CI job rather
    # than something SonarQube Cloud runs from its own side, a draft would get
    # no analysis and marking it ready would not start one.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.14"}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_vocabulary.py
      - run: python scripts/check_tested.py

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.14"}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: mypy scripts tests server methodology

  test:
    runs-on: ubuntu-latest
    # What the coverage report has to account for, and what it deliberately does
    # not. Both are held to sonar.sources and sonar.tests by
    # test_the_coverage_floor_measures_what_the_analysis_reads.
    env: {COV_TARGETS: scripts server methodology, COV_UNSCANNED: tests}
    services:
      postgres:
        # Digest-pinned; a tag alone is not a pin. postgres:16-alpine.
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env: {POSTGRES_PASSWORD: caos, POSTGRES_DB: caos}
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.14"}
      - run: pip install --require-hashes -r requirements-dev.txt
      # Writes coverage.xml; the flags are in pyproject.toml so this and a local
      # run produce the same report.
      - run: pytest
        env:
          CAOS_TEST_POSTGRES_URL: postgresql://postgres:caos@localhost:5432/caos
          # A store suite that skipped is not a store suite that passed.
          CAOS_REQUIRE_POSTGRES: "1"
      # A coverage report is a scanner report. One that measured nothing, or
      # that left out a file it was pointed at, imports as a number rather than
      # as an error -- so it is refused here, before the analysis reads it.
      - run: |
          python scripts/scan_floors.py coverage.xml --cobertura \
                 --cover $COV_TARGETS --unscanned $COV_UNSCANNED
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          # The analysis runs in another job; a missing report there is silent.
          if-no-files-found: error
      - run: python scripts/io_budget.py --assert

  postgres:
    # Every governed race proven on two independent connections, in its own job
    # so the coverage is visible rather than buried in the unit run.
    runs-on: ubuntu-latest
    services:
      postgres:
        # Digest-pinned; a tag alone is not a pin. postgres:16-alpine.
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env: {POSTGRES_PASSWORD: caos, POSTGRES_DB: caos}
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.14"}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pytest tests/test_postgres_races.py
        env:
          CAOS_TEST_POSTGRES_URL: postgresql://postgres:caos@localhost:5432/caos
          # A store suite that skipped is not a store suite that passed.
          CAOS_REQUIRE_POSTGRES: "1"

  sonarqube:
    # The third reviewer, and the one job here that does not decide its own
    # verdict: it submits the analysis, and `SonarCloud Code Analysis` -- posted
    # by SonarQube Cloud's GitHub App and required on `main` (DECISIONS.md 34) --
    # carries the quality gate's answer. It runs from CI rather than from
    # SonarQube Cloud's own side for one reason: automatic analysis cannot import
    # a coverage report, and this repository now has one (DECISIONS.md 41).
    needs: test
    # Both events fire for a branch with a pull request open, and two analyses
    # of one commit are two submissions to one project -- the collision
    # test_exactly_one_job_submits_the_analysis refuses in the workflow and this
    # refuses at run time. A pull request is analysed as one; `main` is analysed
    # as the branch new code is measured against; a branch push is neither.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Blame is what assigns a line to the new-code period the quality gate
      # judges, and a depth-1 clone has no blame to read.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {fetch-depth: 0}
      # Lands coverage.xml at the root, where sonar-project.properties says it is.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: coverage}
      # A secret that never arrives and one the server rejects are the same
      # message from the scanner: "Not authorized or project not found", naming
      # three causes and distinguishing none. That cost three analyses here. The
      # value is never printed; its length is, which tells a truncated paste
      # from a whole one.
      - name: Refuse an analysis with no credential
        env: {SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}"}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is empty: no repository secret of that name reached this job"
            exit 1
          fi
          echo "SONAR_TOKEN received, ${#SONAR_TOKEN} characters"
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          # The one credential this repository has. It is a repository secret and
          # is not in this tree; .gitleaks.toml exempts the project key beside it
          # and nothing else.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  security:
    # Python pinned deliberately. bandit 1.7.10 reaches for ast.Constant.s,
    # which newer interpreters do not provide: under 3.14 it skips every file
    # and exits 0. See docs/AI_CODE_QUALITY.md section 4.
    runs-on: ubuntu-latest
    # gitleaks-action lists a pull request's commits; the default token cannot.
    permissions: {contents: read, pull-requests: read}
    # One list, so what bandit scans and what the floor expects cannot drift, and
    # one for what it deliberately does not (see the ledger in CLAUDE.md).
    env: {SEC_TARGETS: scripts server methodology, SEC_UNSCANNED: tests}
    steps:
      # gitleaks scans a commit range; a depth-1 clone has no range to scan.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install --require-hashes -r requirements-security.txt
      # `|| true` so the floor check, not bandit's exit code, is the verdict:
      # a report that skipped a file must fail even when it found nothing.
      - run: bandit -r $SEC_TARGETS -f json -o bandit.json || true
      - run: |
          python scripts/scan_floors.py bandit.json --no-parse-errors \
                 --cover $SEC_TARGETS --unscanned $SEC_UNSCANNED
      - run: bandit -r $SEC_TARGETS
      - run: |
          pip-audit --require-hashes -r requirements.txt \
                    -r requirements-dev.txt -r requirements-security.txt
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The scan result is the gate; the uploaded artifact is not. Uploading
          # needs `actions: write`, which this job has no other use for.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  size:
    # AI PRs carry ~1.7x the issues of human PRs, and density rises with size.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {fetch-depth: 0}
      - run: |
          # 'vendor/**' as well as '**/vendor/**': the leading **/ requires at
          # least one path component, so it never matches a top-level vendor/.
          n=$(git diff --numstat origin/${{ github.base_ref }}...HEAD -- . \
              ':!*.lock' ':!requirements*.txt' ':!docs/**' \
              ':!vendor/**' ':!**/vendor/**' \
              | awk '{s+=$1+$2} END {print s+0}')
          echo "changed lines: $n"
          [ "$n" -le 800 ] || { echo "PR too large; split it (docs/AI_CODE_QUALITY.md)"; exit 1; }
