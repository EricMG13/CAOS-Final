# CodeRabbit produced the measurements in docs/AI_CODE_QUALITY.md and is the
# third reviewer beside confidence-review and adversarial-reviewer.
language: en-GB
reviews:
  profile: assertive
  auto_review:
    # Each phase stacks on its predecessor to stay under the CI size gate, so a
    # phase PR's base is never `main`. Without this, CodeRabbit skips every one
    # of them: it reviews only the default branch unless told otherwise.
    base_branches:
      - "phase-.*"
  request_changes_workflow: true
  high_level_summary: true
  path_instructions:
    - path: "**/*.py"
      instructions: |
        Enforce CLAUDE.md's eleven invariants. Flag: any float on a money path
        (Decimal only); any bare `except`, `except Exception` without re-raise,
        or `str(exc)` reaching a log or a wire response; any log line carrying
        document-derived text; any JSON model without extra="forbid"; any new
        public function without a test naming it; any synonym for a CONTEXT.md
        term.
    - path: "docs/**"
      instructions: |
        Specification, not code. Flag contradictions with CLAUDE.md's invariants
        or with docs/DECISIONS.md, where later entries override earlier ones.
chat:
  auto_reply: false
