# Automatic analysis' configuration, and it is transitional.
#
# docs/DECISIONS.md section 39 moves this repository to a CI analysis, which
# reads sonar-project.properties and ignores this file. The two cannot be
# switched over in one commit: turning automatic analysis off is done in
# SonarQube Cloud's settings by a person, and until they do it, automatic
# analysis is still the thing that posts `SonarCloud Code Analysis`.
#
# Deleting this file in the same commit that added the other one therefore did
# not remove a configuration nobody reads. It removed the only configuration
# anybody was reading, and the analysis went on running with no exclusions, no
# test classification and no Python version -- judging the 147 Python files of a
# vendored bundle no pull request is allowed to fix. So it stays until the
# switch-over is done, and test_both_analysis_configurations_declare_the_same_scope
# keeps the two files saying the same thing while both exist.
#
# Delete it in the commit that confirms the `sonarqube` job is posting the check.
sonar.sources=scripts,server,methodology
sonar.tests=tests
sonar.python.version=3.14
sonar.exclusions=vendor/**
