# Automatic analysis' configuration, and it is transitional: the switch to a CI
# analysis is a setting a person changes, not a commit, so until they do this is
# the only configuration anybody reads. Deleting it early left the live analysis
# judging the vendored bundle. docs/DECISIONS.md section 41 has the whole of it;
# test_both_analysis_configurations_declare_the_same_scope keeps this file and
# sonar-project.properties saying the same thing while both exist.
#
# Delete it in the commit that confirms the `sonarqube` job is posting the check.
sonar.sources=scripts,server,methodology
sonar.tests=tests
sonar.python.version=3.14
sonar.exclusions=vendor/**
